name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reconcilia
          POSTGRES_PASSWORD: reconcilia
          POSTGRES_DB: reconcilia
        # Mesma porta do docker-compose local: as URLs padrão funcionam sem ajuste.
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U reconcilia -d reconcilia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://reconcilia:reconcilia@localhost:5440/reconcilia
      DIRECT_URL: postgresql://reconcilia:reconcilia@localhost:5440/reconcilia
      TEST_DATABASE_URL: postgresql://reconcilia:reconcilia@localhost:5440/reconcilia_test
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
