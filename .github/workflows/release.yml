name: Release

# Ao enviar uma tag vX.Y.Z (anotada), cria a release do GitHub com a seção [X.Y.Z] do
# CHANGELOG.md como notas e o assunto da tag como título. Sem a seção, falha.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release com as notas do CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: Extrai as notas e o título
        id: notas
        run: |
          version="${TAG#v}"
          awk -v head="## [${version}]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md não tem a seção [${version}]"
            exit 1
          fi
          # O checkout pode trazer a tag sem o objeto anotado; busca de novo para ler o assunto.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          title="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')"
          echo "title=${title:-$TAG}" >> "$GITHUB_OUTPUT"

      - name: Cria a release
        env:
          TITLE: ${{ steps.notas.outputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release ${TAG} já existe; nada a fazer."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file notes.md
